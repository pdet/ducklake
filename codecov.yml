codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "50...100"

  status:
    project:
      default:
        target: auto
        threshold: 0%
        # Fail if overall project coverage decreases
        if_ci_failed: error
    patch:
      default:
        target: 80%
        # Fail if new code in a PR has less than 80% coverage
        if_ci_failed: error

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false

ignore:
  - "test/**"
  - "duckdb/**"
  - "extension-ci-tools/**"
